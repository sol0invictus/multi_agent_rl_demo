<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12">
  <title>How one 3-site organisation rollout becomes 4 training rows (1 lead row + 3 worker rows). Each agent is append-only, so all of its turns stitch into a single token-id sequence where only the model-written tokens receive gradients.</title>
  <style>
    .m { font-family: "DejaVu Sans Mono", Menlo, monospace; font-size: 11px; }
    .lab { font-size: 11px; fill: #1a1a1a; }
    .s { font-size: 11px; fill: #52514e; }
  </style>
  <rect width="880" height="430" fill="#fdfdfd"/>

  <text x="20" y="28" font-weight="bold" font-size="14" fill="#1a1a1a">One 3-site organisation rollout = 4 append-only training rows sharing advantage A_g</text>

  <!-- legend -->
  <rect x="20" y="44" width="16" height="12" fill="#e6e5e1" stroke="#b9b8b2"/>
  <text x="42" y="54" class="s">tokens the agent <tspan font-weight="bold" fill="#1a1a1a">read</tspan> (prompt, worker replies, tool stdout): context only (mask = 0)</text>
  <rect x="520" y="44" width="16" height="12" fill="#2a78d6"/>
  <text x="542" y="54" class="s">tokens the agent <tspan font-weight="bold" fill="#1a1a1a">wrote</tspan>: trained with A_g (mask = 1)</text>

  <!-- Row 1: Lead -->
  <text x="20" y="88" font-weight="bold" fill="#1a1a1a">Row 1 — lead agent</text>
  <text x="165" y="88" class="s">(trained in both --train-roles all and --train-roles lead)</text>
  <g transform="translate(20,96)">
    <rect x="0"   width="165" height="28" fill="#e6e5e1" stroke="#b9b8b2"/><text x="8" y="18" class="lab">sys + question + sites</text>
    <rect x="165" width="175" height="28" fill="#2a78d6"/><text x="173" y="18" class="lab" fill="#fff">think + 3× parallel ask()</text>
    <rect x="340" width="180" height="28" fill="#e6e5e1" stroke="#b9b8b2"/><text x="348" y="18" class="lab">3× worker replies</text>
    <rect x="520" width="200" height="28" fill="#2a78d6"/><text x="528" y="18" class="lab" fill="#fff">think + combine + submit()</text>
    <text x="732" y="18" class="m" fill="#2a78d6">← A_g</text>
  </g>

  <!-- Rows 2-4: Workers -->
  <text x="20" y="154" font-weight="bold" fill="#1a1a1a">Rows 2–4 — site workers (atlas, boreal, cobalt)</text>
  <text x="340" y="154" class="s">(trained in --train-roles all; dropped in --train-roles lead)</text>

  <g transform="translate(20,164)">
    <text x="0" y="18" class="m" fill="#52514e">atlas </text>
    <rect x="52"  width="140" height="26" fill="#e6e5e1" stroke="#b9b8b2"/><text x="60" y="17" class="lab">sys + lead request</text>
    <rect x="192" width="150" height="26" fill="#2a78d6"/><text x="200" y="17" class="lab" fill="#fff">think + list_files()</text>
    <rect x="342" width="95"  height="26" fill="#e6e5e1" stroke="#b9b8b2"/><text x="350" y="17" class="lab">file names</text>
    <rect x="437" width="155" height="26" fill="#2a78d6"/><text x="445" y="17" class="lab" fill="#fff">think + run_python()</text>
    <rect x="592" width="90"  height="26" fill="#e6e5e1" stroke="#b9b8b2"/><text x="600" y="17" class="lab">stdout</text>
    <rect x="682" width="110" height="26" fill="#2a78d6"/><text x="690" y="17" class="lab" fill="#fff">reply(msg)</text>
    <text x="802" y="17" class="m" fill="#2a78d6">← A_g</text>
  </g>

  <g transform="translate(20,196)">
    <text x="0" y="18" class="m" fill="#52514e">boreal</text>
    <rect x="52"  width="140" height="26" fill="#e6e5e1" stroke="#b9b8b2"/><text x="60" y="17" class="lab">sys + lead request</text>
    <rect x="192" width="175" height="26" fill="#2a78d6"/><text x="200" y="17" class="lab" fill="#fff">think + run_python()</text>
    <rect x="367" width="95"  height="26" fill="#e6e5e1" stroke="#b9b8b2"/><text x="375" y="17" class="lab">stdout</text>
    <rect x="462" width="120" height="26" fill="#2a78d6"/><text x="470" y="17" class="lab" fill="#fff">reply(msg)</text>
    <text x="592" y="17" class="m" fill="#2a78d6">← A_g</text>
  </g>

  <g transform="translate(20,228)">
    <text x="0" y="18" class="m" fill="#52514e">cobalt</text>
    <rect x="52"  width="140" height="26" fill="#e6e5e1" stroke="#b9b8b2"/><text x="60" y="17" class="lab">sys + lead request</text>
    <rect x="192" width="150" height="26" fill="#2a78d6"/><text x="200" y="17" class="lab" fill="#fff">think + read_file()</text>
    <rect x="342" width="95"  height="26" fill="#e6e5e1" stroke="#b9b8b2"/><text x="350" y="17" class="lab">CSV head</text>
    <rect x="437" width="155" height="26" fill="#2a78d6"/><text x="445" y="17" class="lab" fill="#fff">think + run_python()</text>
    <rect x="592" width="90"  height="26" fill="#e6e5e1" stroke="#b9b8b2"/><text x="600" y="17" class="lab">stdout</text>
    <rect x="682" width="110" height="26" fill="#2a78d6"/><text x="690" y="17" class="lab" fill="#fff">reply(msg)</text>
    <text x="802" y="17" class="m" fill="#2a78d6">← A_g</text>
  </g>

  <!-- LoRA + LFM2 details -->
  <line x1="20" y1="276" x2="860" y2="276" stroke="#e5e5e5"/>
  <text x="20" y="300" font-weight="bold" font-size="13" fill="#1a1a1a">Three implementation details that make this work on one 24 GB GPU</text>

  <rect x="20" y="314" width="268" height="98" rx="5" fill="#f3f2ee" stroke="#b9b8b2"/>
  <text x="32" y="334" font-weight="bold" fill="#1a1a1a">1  LoRA r=32 + merged sync</text>
  <text x="32" y="352" class="s">Trains W + (α/r)BA on q/k/v/out + w1/w2/w3</text>
  <text x="32" y="368" class="s">(40.3M params = 1.47%). Folds B·A into base</text>
  <text x="32" y="384" class="s">weights after each step (vLLM LoRA decode</text>
  <text x="32" y="400" class="s">for LFM2 is ~15× slower than merged).</text>

  <rect x="306" y="314" width="268" height="98" rx="5" fill="#f3f2ee" stroke="#b9b8b2"/>
  <text x="318" y="334" font-weight="bold" fill="#1a1a1a">2  No sequence packing</text>
  <text x="318" y="352" class="s">LFM2 interleaves short-convolution layers</text>
  <text x="318" y="368" class="s">with attention. Packing two agents' rows</text>
  <text x="318" y="384" class="s">into one 1D sequence leaks conv state</text>
  <text x="318" y="400" class="s">across row boundaries; each row runs clean.</text>

  <rect x="592" y="314" width="268" height="98" rx="5" fill="#f3f2ee" stroke="#b9b8b2"/>
  <text x="604" y="334" font-weight="bold" fill="#1a1a1a">3  Tandem-repeat masking</text>
  <text x="604" y="352" class="s">If a call gets stuck repeating a short token</text>
  <text x="604" y="368" class="s">loop until max_tokens, its mask is zeroed</text>
  <text x="604" y="384" class="s">so a lucky right answer elsewhere in the org</text>
  <text x="604" y="400" class="s">never reinforces a degenerate loop.</text>
</svg>
